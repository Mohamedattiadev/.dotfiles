# Font (matches Alacritty exactly)
font_family            Source Code Pro
bold_font              Source Code Pro Bold
italic_font            Source Code Pro Italic
bold_italic_font       Source Code Pro Bold Italic
font_size              11.0
adjust_line_height     1
adjust_column_width    0

# Window appearance
background_opacity     0.95
dynamic_background_opacity no
window_padding_width   6 6

# Doom One color scheme
background             #282c34
foreground             #bbc2cf
cursor                 #3498db
cursor_text_color      #282c34
selection_foreground   #bbc2cf
selection_background   #3e4451

# Normal colors
color0  #1c1f24
color1  #ff6c6b
color2  #98be65
color3  #da8548
color4  #51afef
color5  #c678dd
color6  #5699af
color7  #abb2bf

# Bright colors
color8  #5b6268
color9  #da8548
color10 #4db5bd
color11 #ecbe7b
color12 #3071db
color13 #a9a1e1
color14 #46d9ff
color15 #dfdfdf

# Scrolling
scrollback_lines       5000

# Enable image support (✅ this is the key part)
enable_images          yes
allow_remote_control   yes
shell_integration      enabled

# Keyboard bindings (Alacritty-style)
map ctrl+shift+v       paste_from_clipboard
map ctrl+shift+c       copy_to_clipboard
map shift+insert       paste_from_selection
map ctrl+0             change_font_size all 0
map ctrl+equal         change_font_size all +2.0
map ctrl+plus          change_font_size all +2.0
map ctrl+minus         change_font_size all -2.0
map f11                toggle_fullscreen
map ctrl+l             clear_log
map ctrl+l             send_text all \x0c
map page_up            scroll_page_up
map page_down          scroll_page_down
map shift+home         scroll_home
map shift+end          scroll_end

# Terminal type
env TERM xterm-256color
