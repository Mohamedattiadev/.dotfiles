
# Backend: try "xrender" for older GPUs, "glx" for newer ones
backend = "glx";

# Performance options
vsync = true
unredir-if-possible = true
refresh-rate = 60

# Disable fading (this causes delay)
fading = false
fade-in-step = 0.02
fade-out-step = 0.02
fade-delta = 4

# Shadows (optional — you can turn off if you want faster)
shadow = false

# Transparency (set specific apps below or use opacity rules)
inactive-opacity = 1.0
active-opacity = 1.0
frame-opacity = 1.0

# Corner radius (requires patched picom)
corner-radius = 0

# Speed up rendering
use-damage = true
